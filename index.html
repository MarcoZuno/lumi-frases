<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Lumi Frases ☕</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo-img" src="logo.png" alt="Lumi Frases" /></div>
  </header>

  <main class="wrap wrap-narrow">
    <h1>¿Quién eres hoy?</h1>
    <p class="subtitle">Elige tu rol para entrar al panel de frases de Lumi Café.</p>

    <div class="roles">
      <a class="role-card" href="escritor.html">
        <div class="icon">✍️</div>
        <h2>Soy quien escribe</h2>
        <p>Envío el texto de la frase y la imagen de referencia.</p>
      </a>
      <a class="role-card" href="disenador.html">
        <div class="icon">🎨</div>
        <h2>Soy el diseñador</h2>
        <p>Recibo las frases del día en tiempo real para armar el diseño.</p>
      </a>
    </div>
